<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки на покупку клавиатуры в KeyStore.">
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="Оформление заявки - KeyStore">
  <meta property="og:description" content="Оставьте заявку, и мы свяжемся с вами.">
  <meta property="og:image" content="https://z1kax.github.io/kr2-bootstrap-shop/images/keyboard-ardor-large.jpg">
  <meta property="og:url" content="https://z1kax.github.io/kr2-bootstrap-shop/order.html">

  <title>Заявка - KeyStore</title>
  
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <script src="js/main.js" defer></script>
</head>
<body class="bg-light">
  <header class="bg-primary text-white py-4">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-12 col-md-8"><h1 class="h3 mb-1">KeyStore</h1><p class="mb-0 opacity-75">Учебный интернет-магазин клавиатур на Bootstrap</p></div>
        <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0"><span class="badge bg-light text-primary">КР №2</span></div>
      </div>
    </div>
  </header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">KeyStore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заявка</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white py-3">
            <h1 class="h4 mb-0">Форма заявки</h1>
          </div>
          <div class="card-body p-4">
            <div class="alert alert-info" role="alert">Поля со звёздочкой (*) обязательны.</div>
            
            <form id="orderForm">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" name="name" type="text" class="form-control" placeholder="Иван Иванов" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" name="email" type="email" class="form-control" placeholder="example@mail.ru" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-phone" class="form-label">Телефон</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" name="phone" type="tel" class="form-control" placeholder="900 000-00-00">
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-product" class="form-label">Товар</label>
                  <select id="order-product" name="product" class="form-select">
                    <option selected>Выберите товар</option>
                    <option value="ardor">ARDOR Blade Pro</option>
                    <option value="logitech">Logitech G413 SE</option>
                    <option value="keychron">Keychron K2 V2</option>
                    <option value="hyperx">HyperX Alloy Origins</option>
                    <option value="oklick">Oklick 980G</option>
                    <option value="ducky">Ducky One 3</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" name="comment" class="form-control" rows="4" placeholder="Напишите ваши пожелания..."></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">Я согласен на обработку данных *</label>
                  </div>
                </div>
                <div class="col-12 mt-4">
                  <button class="btn btn-primary btn-lg" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary btn-lg" type="reset">Очистить</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          Заявка успешно отправлена! Мы свяжемся с вами.
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center text-md-start">
      <div class="row align-items-center">
        <div class="col-12 col-md-6 mb-3 mb-md-0"><p class="mb-0">&copy; 2026 KeyStore. Учебный проект.</p></div>
        <div class="col-12 col-md-6 text-md-end"><a class="text-white text-decoration-none me-3" href="catalog.html">Каталог</a><a class="text-white text-decoration-none" href="order.html">Заявка</a></div>
      </div>
    </div>
  </footer>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
